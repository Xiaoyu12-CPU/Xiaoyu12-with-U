name: Windows x64 Build

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis 2>&1 | tee build-log.txt
        shell: bash

      - name: Post build errors as commit comment
        if: failure()
        shell: bash
        run: |
          # 提取最后的编译错误(rustc error 块 + 尾部 100 行),发成 commit comment。
          # Actions 日志 API 需要管理员权限,而 commit comment 公开可读,
          # 让无本地 Windows 工具链的协作者也能拿到真实报错。
          ERRORS=$(grep -A4 "^error" build-log.txt | tail -120)
          if [ -z "$ERRORS" ]; then ERRORS=$(tail -60 build-log.txt); fi
          PAYLOAD=$(jq -n --arg body "🚨 **Windows build failed** (\`$GITHUB_SHA\`)

          \`\`\`
          $ERRORS
          \`\`\`" '{body: $body}')
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d "$PAYLOAD" | head -c 300

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log-${{ github.sha }}
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: withXiaoyu12-windows-x64-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

