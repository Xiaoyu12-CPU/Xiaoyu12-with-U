name: Windows x64 Build

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis 2>&1 | tee build-log.txt
        shell: bash

      - name: Save build errors for comment
        if: failure()
        shell: bash
        run: |
          {
            printf '🚨 **Windows build failed** (`%s`)\n\n```text\n' "$GITHUB_SHA"
            tail -80 build-log.txt
            printf '\n```\n'
          } > error-body.md

      - name: Post build errors as commit comment
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F body=@"error-body.md"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log-${{ github.sha }}
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: withXiaoyu12-windows-x64-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

