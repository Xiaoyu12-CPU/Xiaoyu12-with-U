name: Windows x64 Build

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Compile Rust (cargo check)
        run: cargo check --color never 2>&1 | tee check-log.txt
        shell: bash
        working-directory: src-tauri

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis 2>&1 | tee build-log.txt
        shell: bash

      - name: Publish build errors to job summary
        if: failure()
        shell: bash
        run: |
          # job summary 供人查看;真实诊断走下面的 ci-logs 分支。
          LOG=check-log.txt; [ -f build-log.txt ] && LOG=build-log.txt
          {
            printf '### Windows build failed (`%s`)\n\n' "$GITHUB_SHA"
            printf '```text\n'
            tail -80 "$LOG"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push build log to ci-logs branch
        if: failure()
        shell: bash
        run: |
          # check-run summary 并不总是回传 API;artifact 又需要认证。
          # git push 走 checkout@v4 的持久化凭据(contents:write),而
          # raw.githubusercontent.com 对公开仓库无需任何令牌即可读取。
          git config user.name "ci-log-bot"
          git config user.email "actions@github.com"
          git checkout -B ci-logs
          git rm -rf --cached . -q
          # cargo check 在 src-tauri/ 下运行,日志也在那里
          cp src-tauri/check-log.txt . 2>/dev/null || true
          cp build-log.txt . 2>/dev/null || true
          # 复制完成后再清空工作区,避免误删日志文件
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'check-log.txt' ! -name 'build-log.txt' -exec rm -rf {} +
          git add -A
          git commit -m "ci logs for $GITHUB_SHA" || true
          git push origin ci-logs --force

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log-${{ github.sha }}
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: withXiaoyu12-windows-x64-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

