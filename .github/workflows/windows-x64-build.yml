name: Windows x64 Build

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis 2>&1 | tee build-log.txt
        shell: bash

      - name: Post build errors as commit comment
        if: failure()
        shell: bash
        run: |
          # 提取最后的编译错误,用 python 构造 JSON(避免 jq 引号地狱),
          # 发成 commit comment(公开可读,无需任何令牌即可查看)。
          python - <<'PYEOF'
          import json, os, urllib.request

          log = open("build-log.txt", encoding="utf-8", errors="replace").read()
          lines = [ln for ln in log.splitlines()]
          tail = "\n".join(lines[-80:])
          body = "🚨 **Windows build failed** (`%s`)\n\n```text\n%s\n```" % (
              os.environ.get("GITHUB_SHA", "")[:12], tail)

          payload = json.dumps({"body": body}).encode()
          url = "https://api.github.com/repos/%s/commits/%s/comments" % (
              os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"])
          req = urllib.request.Request(url, data=payload, method="POST", headers={
              "Authorization": "Bearer %s" % os.environ["GITHUB_TOKEN"],
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          })
          try:
              with urllib.request.urlopen(req) as resp:
                  print("comment created:", resp.status)
          except Exception as error:
              print("comment failed:", error)
          PYEOF

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log-${{ github.sha }}
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: withXiaoyu12-windows-x64-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

