name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundle-args: --bundles nsis
            artifact-glob: src-tauri/target/*/bundle/nsis/*.exe
            asset-suffix: windows-x64-setup
          - name: macos-arm64
            runner: macos-14
            rust-target: aarch64-apple-darwin
            bundle-args: --bundles dmg
            artifact-glob: src-tauri/target/*/bundle/dmg/*.dmg
            asset-suffix: macOS-arm64
          - name: macos-x64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
            bundle-args: --bundles dmg
            artifact-glob: src-tauri/target/*/bundle/dmg/*.dmg
            asset-suffix: macOS-x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: |
          pnpm test:reminders
          pnpm test:input
          pnpm test:control-center

      - name: Build release bundle
        run: pnpm tauri build ${{ matrix.bundle-args }}

      - name: Normalize asset name
        shell: bash
        run: |
          set -euo pipefail
          file=$(ls ${{ matrix.artifact-glob }} | head -n1)
          ext="${file##*.}"
          cp "$file" "withXiaoyu12-${{ matrix.asset-suffix }}-${GITHUB_REF_NAME}.${ext}"
          echo "Packaged withXiaoyu12-${{ matrix.asset-suffix }}-${GITHUB_REF_NAME}.${ext}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset-suffix }}
          path: withXiaoyu12-*
          if-no-files-found: error

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: withXiaoyu12 ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
